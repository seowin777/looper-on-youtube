<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looper for YouTube Videos was removed</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PFQD7Q7CP1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PFQD7Q7CP1');
  gtag('event', 'uninstall', {extension: 'looper-on-youtube'});
  function why(reason) {
    gtag('event', 'uninstall_' + reason, {extension: 'looper-on-youtube'}); // one event per reason: shows up in GA Events as is
    document.querySelector('main').innerHTML = '<svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#1E8E3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto"><path d="M20 6 9 17l-5-5"/></svg><h1>Thank you</h1>';
  }
</script>
<style>
  :root { --bg:#fff; --text:#1f2328; --line:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --text:#e8eaed; --line:#3c4043; } }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:520px; margin:0 auto; padding:48px 16px; text-align:center; }
  button { display:block; width:100%; margin:8px 0; min-height:48px; padding:0 12px; font:inherit; cursor:pointer;
           background:none; color:inherit; border:1px solid var(--line); border-radius:8px; }
</style>
</head>
<body>
<main>
  <h1>Why did you remove it?</h1>
  <button onclick="why('button_gone')">The button disappeared</button>
  <button onclick="why('not_accurate')">The loop was not accurate</button>
  <button onclick="why('in_the_way')">It got in the way of YouTube</button>
  <button onclick="why('not_needed')">I did not need it any more</button>
  <button onclick="why('other')">Other</button>
</main>
</body>
</html>
